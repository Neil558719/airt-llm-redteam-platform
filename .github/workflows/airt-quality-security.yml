name: Airt unified quality and security checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run live Dify/Judge tests
        required: false
        default: false
        type: boolean
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[test]'
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python verify_migration.py
      - name: Validate shared cases
        run: .venv/bin/airt cases validate shared_cases/unified_chatflow.yaml
      - name: Generate offline report dashboard
        run: |
          mkdir -p reports/assess reports/security reports/quality reports/release
          .venv/bin/airt trend --reports reports/quality
          .venv/bin/airt dashboard --reports reports --out artifacts
      - name: Upload offline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airt-offline-reports
          path: |
            reports/
            artifacts/

  shared-quality:
    runs-on: ubuntu-latest
    needs: offline
    defaults:
      run:
        working-directory: LLM应用测试框架
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e .
      - run: .venv/bin/python -m pytest -q tests/test_shared_quality.py tests/test_shared_cases.py tests/test_unified_results.py

  live-chatflow-security:
    if: ${{ inputs.run_live == true }}
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[test]'
      - name: Prepare CI Chatflow config
        env:
          DIFY_BASE_URL: ${{ secrets.DIFY_BASE_URL }}
        run: |
          test -n "$DIFY_BASE_URL"
          sed "s#http://127.0.0.1/v1#${DIFY_BASE_URL%/}#g" config.dify.agent.yaml > config.ci.agent.yaml
      - name: Run Chatflow security
        run: .venv/bin/airt chatflow security --config config.ci.agent.yaml --out runs/ci-chatflow
        env:
          DIFY_AGENT_API_KEY: ${{ secrets.DIFY_AGENT_API_KEY }}
          JUDGE_BASE_URL: ${{ secrets.JUDGE_BASE_URL }}
          JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY }}
          JUDGE_MODEL: ${{ secrets.JUDGE_MODEL }}
      - name: Generate security trend and dashboard
        run: |
          .venv/bin/airt trend --reports reports/security
          .venv/bin/airt dashboard --reports reports --out artifacts/security
      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airt-chatflow-security
          path: |
            reports/security/
            artifacts/security/
            runs/ci-chatflow/results.jsonl

  live-chatflow-quality:
    if: ${{ inputs.run_live == true }}
    runs-on: ubuntu-latest
    needs: [offline, shared-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[test]'
      - name: Prepare CI Chatflow config
        env:
          DIFY_BASE_URL: ${{ secrets.DIFY_BASE_URL }}
        run: |
          test -n "$DIFY_BASE_URL"
          sed "s#http://127.0.0.1/v1#${DIFY_BASE_URL%/}#g" config.dify.agent.yaml > config.ci.agent.yaml
      - name: Run Chatflow quality
        run: .venv/bin/airt chatflow quality --config config.ci.agent.yaml --out runs/ci-chatflow-quality
        env:
          DIFY_AGENT_API_KEY: ${{ secrets.DIFY_AGENT_API_KEY }}
          JUDGE_BASE_URL: ${{ secrets.JUDGE_BASE_URL }}
          JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY }}
          JUDGE_MODEL: ${{ secrets.JUDGE_MODEL }}
      - name: Generate quality trend and dashboard
        run: |
          .venv/bin/airt trend --reports reports/quality
          .venv/bin/airt dashboard --reports reports --out artifacts/quality
      - name: Upload quality artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airt-chatflow-quality
          path: |
            reports/quality/
            artifacts/quality/
            runs/ci-chatflow-quality/results.jsonl

  unified-gate:
    if: ${{ always() && inputs.run_live == true && needs.offline.result == 'success' && needs.shared-quality.result == 'success' && needs.live-chatflow-security.result == 'success' && needs.live-chatflow-quality.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [offline, shared-quality, live-chatflow-security, live-chatflow-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[test]'
      - name: Download Chatflow results
        uses: actions/download-artifact@v4
        with:
          pattern: airt-chatflow-*
          path: gate-input
          merge-multiple: false
      - name: Convert Airt results to shared contract
        run: |
          mkdir -p gate-results
          security_input="$(find gate-input/airt-chatflow-security -path '*/results.jsonl' -print -quit)"
          quality_input="$(find gate-input/airt-chatflow-quality -path '*/results.jsonl' -print -quit)"
          test -n "$security_input"
          test -n "$quality_input"
          .venv/bin/python scripts/airt_results_to_v1.py --input "$security_input" --output gate-results/security.jsonl
          .venv/bin/python scripts/airt_results_to_v1.py --input "$quality_input" --output gate-results/quality.jsonl
      - name: Run unified gate
        run: |
          .venv/bin/python scripts/unified_gate.py \
            --results gate-results/security.jsonl \
            --results gate-results/quality.jsonl \
            --require-security \
            --min-security-score 90 \
            --min-quality-pass-rate 1.0 \
            --max-latency-ms 20000





