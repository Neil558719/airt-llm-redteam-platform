[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llmtest"
version = "0.1.0"
description = "LLM 应用自动化测试框架：语义断言 / JSON Schema 校验 / 相似度断言 / LLM-as-Judge / 幻觉检测 / 质量报告"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LLM Testing Team" }]
keywords = ["llm", "testing", "pytest", "evaluation", "rag", "hallucination"]
classifiers = [
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=7.0",
    "jsonschema>=4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
real = [
    "openai>=1.0",
    "anthropic>=0.30",
]
dev = [
    "pytest>=7.0",
]
ci = [
    "pytest-timeout>=2.3",
    "pytest-rerunfailures>=14.0",
]

[project.entry-points.pytest11]
llmtest = "llmtest.plugin"

[tool.setuptools.packages.find]
include = ["llmtest*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"


